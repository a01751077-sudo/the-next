name: the_platform
description: "THE PLATFORM - PINC NETWORK Cross-Platform App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_bloc: ^8.1.0
  provider: ^6.1.0
  
  # Storage
  hive_ce: ^2.19.0
  hive_ce_flutter: ^2.2.0
  flutter_secure_storage: ^9.2.0
  
  # P2P/WebRTC
  flutter_webrtc: ^0.11.0
  
  # Encryption
  cryptography: ^2.7.0
  crypto: ^3.0.3
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  
  # HTTP/Networking
  http: ^1.2.0
  web_socket_channel: ^2.4.0
  
  # Utilities
  uuid: ^4.3.0
  intl: ^0.19.0
  equatable: ^2.0.5
  get_it: ^7.6.0
  
  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_ce_generator: ^1.7.0

flutter:
  uses-material-design: true